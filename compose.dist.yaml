# Distributed deployment: core-api (REST), multiplayer (Socket.IO), Mongo and
# Redis. Composes the images individually; use compose.prod.yaml for the
# monolithic stack.
#
# NOTE: by default this file does not include a reverse proxy. The host proxy
# (Nginx, Caddy, Cloudflare tunnel, ...) must route:
#   /api/*      -> core-api:3001
#   /socket.io/*-> multiplayer:3002   (with sticky sessions disabled; the
#                                  gateway is stateful per-room, so route all
#                                  socket traffic to one instance)
#
# To serve the SPA from this stack instead, start it with
#   docker compose -f compose.dist.yaml --profile frontend up -d
# (requires ../synapse-frontend checked out next to this repo).

name: synapse-dist

services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo_dist_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { if (!db.hello().setName) rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}) } catch (e) {} quit(db.hello().setName === 'rs0' && db.hello().isWritablePrimary ? 0 : 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", ""]  # cache only; no persistence needed
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  core-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: core-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      PORT: 3001
      FRONTEND_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB:-synapse}?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
    ports:
      - "127.0.0.1:3001:3001"
    stop_grace_period: 30s

  multiplayer:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP: multiplayer
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SWAGGER_ENABLED: "false"
      PORT: 3002
      FRONTEND_URL: ${PUBLIC_APP_URL:?PUBLIC_APP_URL is required}
      DATABASE_URL: mongodb://mongo:27017/${MONGO_DB:-synapse}?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      JWT_ACCESS_TTL_SECONDS: 900
      JWT_REFRESH_TTL_DAYS: 30
    ports:
      - "127.0.0.1:3002:3002"
    stop_grace_period: 30s

  frontend:
    profiles: ["frontend"]
    build:
      context: ../synapse-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      core-api:
        condition: service_started
      multiplayer:
        condition: service_started
    environment:
      CORE_API_UPSTREAM: core-api:3001
      MULTIPLAYER_UPSTREAM: multiplayer:3002
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

volumes:
  mongo_dist_data:
